[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xray-attenuation-workbench"
dynamic = ["version"]          # single source of truth: xray_workbench/__init__.py
description = "X-ray attenuation, composition and multilayer materials workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohamed Faizal Ussama Jalaludeen"}]
keywords = ["x-ray", "attenuation", "beer-lambert", "materials-science",
            "glass", "ceramics", "multilayer", "xraydb", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Runtime requirements. Ranges, not pins: an application lock for the exact
# verified environment lives in requirements-lock.txt. scipy is a transitive
# xraydb requirement and is only imported directly by the test suite.
dependencies = [
    "numpy>=2.1,<3",
    "xraydb>=4.5.8,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-cov>=5",
    "scipy>=1.14,<2",
    "ruff>=0.16",
    "mypy>=1.13",
]
notebook = ["jupyterlab>=4.2"]
# NOT an independent check on the default backend: measured bit-identical to
# the Elam data. See xray_workbench/backends/xraylib_backend.py.
xraylib = ["xraylib>=4.1"]

[project.scripts]
xray-workbench = "xray_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/faizalusama/X-ray_attenuation_calculator"
Repository = "https://github.com/faizalusama/X-ray_attenuation_calculator"
Issues = "https://github.com/faizalusama/X-ray_attenuation_calculator/issues"

[tool.hatch.version]
path = "xray_workbench/__init__.py"

# The browser assets live at the repository root so that the source tree stays
# the primary way to run the workbench. They are copied into the wheel beside
# the package, and server.py resolves either location at import time.
[tool.hatch.build.targets.wheel]
packages = ["xray_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "xray_workbench/static"

[tool.hatch.build.targets.sdist]
include = [
    "/xray_workbench",
    "/static",
    "/tests",
    "/docs",
    "/examples",
    "/notebooks",
    "/launch.py",
    "/requirements*.txt",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Warnings raised by this project's own code are errors: they signal a
    # real problem we control. Upstream libraries resolve to different
    # versions per platform and Python, and a deprecation notice in one of
    # them must not fail the suite on some runners but not others.
    "error:::xray_workbench",
    "error:::tools",
]

[tool.coverage.run]
source = ["xray_workbench"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "legacy", "static/vendor", "_snapshots"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "NPY",       # numpy-specific
    "PT",        # pytest style
    "RET",       # return consistency
    "ARG",       # unused arguments
]
ignore = [
    "E501",      # long lines are checked by the formatter's line-length instead
    "RUF001",    # scientific text intentionally uses ·, µ, −, ³ and similar
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "B011"]
# test_nist.py compares twelve tabulated reference values. unittest's subTest
# reports each comparison separately, which pytest's bare assert cannot do, so
# the unittest-style assertions there are deliberate.
"tests/test_nist.py" = ["PT009"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

# `ruff format` is intentionally NOT part of the checks. The engine is written
# in a deliberate compact style (grouped dict literals, aligned continuations)
# that reads as tabulated scientific data; running the formatter over it would
# expand those blocks and obscure the structure without improving anything.
# Formatting is reviewed by eye; `ruff check` enforces the rules that matter.
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["xray_workbench", "launch.py", "tools"]
strict = true
warn_unreachable = true
exclude = ["^legacy/", "^\\.venv/"]

[[tool.mypy.overrides]]
# XrayDB ships no type information; xraylib is a SWIG wrapper around a C library.
module = ["xraydb.*", "xraylib.*", "xraylib"]
ignore_missing_imports = true
