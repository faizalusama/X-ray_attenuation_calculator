name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
        # The verified reference environment is Windows; the other platforms
        # guard against accidental platform-specific assumptions.
        exclude:
          - {os: macos-latest, python: "3.12"}
          - {os: macos-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install optional xraylib backend
        # xraylib publishes wheels for a subset of platforms and Python
        # versions. Its tests use importorskip, so a failure here must not fail
        # the job - it just means the equivalence checks skip on this runner.
        continue-on-error: true
        run: python -m pip install "xraylib>=4.1"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Integrity manifest is current
        # The 0.2.0 archive shipped a manifest that no longer matched three of
        # its own files. Checking it here means that cannot happen unnoticed.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/manifest.py verify

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    name: Browser assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check static/app.js
          node --check static/dashboard.js

      - name: Frontend tests
        run: |
          node tests/test_frontend.cjs
          node tests/test_dashboard.cjs

  package:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Confirm the wheel carries its browser assets
        # A wheel without static/index.html installs cleanly and then fails at
        # import time, so assert the payload rather than trusting the build.
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "xray_workbench/static/index.html",
              "xray_workbench/static/app.js",
              "xray_workbench/static/dashboard.js",
              "xray_workbench/static/styles.css",
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f"{wheel} is missing: {missing}")
          print(f"{wheel} contains all required browser assets.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
