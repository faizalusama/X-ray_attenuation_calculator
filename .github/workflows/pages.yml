name: Publish browser version

# GitHub's github-pages environment accepts deployments from the default branch,
# so the site follows main. A release tag does not change what is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -e .

      # The Pyodide release is 340 MB; keep what the site needs between runs.
      - uses: actions/cache@v4
        with:
          path: .pyodide-cache
          key: pyodide-${{ hashFiles('tools/build_web.py') }}

      - name: Build the site
        run: python tools/build_web.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
